name: Build Mini Acrobat (macOS)

# Trigger manually from the Actions tab, or automatically on push to main
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow pyinstaller
          # If you have a requirements.txt, use this instead:
          # pip install -r requirements.txt pyinstaller

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --noconfirm \
            --name "MiniAcrobat" \
            --hidden-import=pymupdf \
            --hidden-import=PIL \
            pdf_reader_v9.py
        # Rename pdf_reader_v9.py above if your entry-point filename differs.
        # If you have a custom icon, add: --icon=icon.icns  (must be .icns for macOS, not .ico)

      - name: Zip the .app bundle (preserves permissions correctly)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "MiniAcrobat.app" "MiniAcrobat-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniAcrobat-macOS
          path: dist/MiniAcrobat-macOS.zip
